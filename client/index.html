<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0B0F" />

    <!-- ── Primary meta ─────────────────────────────────────────────────────
         PLACEHOLDER: replace the name, tagline and domain below once the
         real details are confirmed. They are also mirrored in
         src/content/site.ts — keep the two in sync. -->
    <title>Miles — Developer building websites, web apps and custom systems</title>
    <meta
      name="description"
      content="Computer Science student and developer. I design and build websites, web applications and custom systems for individuals and small businesses, with a modern AI-assisted engineering workflow."
    />
    <link rel="canonical" href="https://your-domain.com/" />
    <meta name="author" content="Miles" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- ── Open Graph / Twitter ───────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miles" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:title"
      content="Miles — Developer building websites, web apps and custom systems"
    />
    <meta
      property="og:description"
      content="I design and build websites, web applications and custom systems for individuals and small businesses."
    />
    <meta property="og:image" content="https://your-domain.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── Icons ──────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts are self-hosted and imported from src/main.ts — no font CDN, no
         third-party request on first paint. See that file for why. -->

    <!-- Paint the ground immediately so there is never a white flash. -->
    <style>
      html {
        background: #0a0b0f;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0a0b0f;
      }
    </style>

    <!-- ── Structured data ────────────────────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Miles",
        "url": "https://your-domain.com/",
        "jobTitle": "Software Developer",
        "description": "Computer Science student and developer building websites, web applications and custom systems.",
        "knowsAbout": [
          "Web Development",
          "Software Development",
          "Cloud Computing",
          "Amazon Web Services",
          "Cybersecurity",
          "AI-assisted Development"
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
